[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "farms"
version = "0.1.28"
description = "Financial Analysis & Risk Management: A Python toolkit for loading financial data and performing regression and portfolio analysis for teaching and research."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Brian Boyer" }, { name = "Royston Vance" }]
dependencies = [
    "pandas>=2.2,<4",
    "pandas-datareader>=0.11,<1",
    "requests>=2.32.4",
    "statsmodels>=0.14.5",
]

[project.urls]
Homepage = "https://github.com/boyerb/farms"
Issues = "https://github.com/boyerb/farms/issues"

[project.optional-dependencies]
dev = [
  "ipykernel>=6.0",
  "pytest>=8.0",
  "ruff>=0.6",
  "mypy>=1.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "python-dotenv>=1.2.1",
]
